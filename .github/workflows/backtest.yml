name: backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback in days"
        default: "730"
  schedule:
    - cron: "23 20 * * 6"     # Saturday 20:23 UTC, before the Sunday review

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtests on real data
        env:
          KISMAT_CACHE_TTL_HOURS: "24"
        run: |
          DAYS="${{ inputs.days || '730' }}"
          OUT="research/backtests/$(date -u +%Y-%m-%d).md"
          mkdir -p research/backtests
          echo "# Backtest $(date -u +%Y-%m-%d), ${DAYS} days, config/risk.yaml settings" > "$OUT"
          echo "" >> "$OUT"
          for cls in crypto us_stocks au_stocks; do
            python -m kismat backtest --asset-class $cls --days "$DAYS" --report "$OUT"
            python -m kismat backtest --asset-class $cls --days "$DAYS" --no-trend-break --report "$OUT"
          done
          echo "" >> "$OUT"; echo "# Whole universe, variants (baseline = config/risk.yaml)" >> "$OUT"; echo "" >> "$OUT"
          python -m kismat backtest --days "$DAYS" --report "$OUT"
          python -m kismat backtest --days "$DAYS" --rotation-margin 0.30 --report "$OUT"
          python -m kismat backtest --days "$DAYS" --no-trend-break --report "$OUT"
          python -m kismat backtest --days "$DAYS" --trend-break-days 3 --report "$OUT"
          python -m kismat backtest --days "$DAYS" --time-stop 20 --report "$OUT"
          python -m kismat backtest --days "$DAYS" --regime 0.5 --report "$OUT"
          python -m kismat backtest --days "$DAYS" --regime 0.5 --trend-break-days 3 --report "$OUT"
          python -m kismat backtest --days "$DAYS" --regime 0.5 --trend-break-days 3 --time-stop 20 --report "$OUT"
          cat "$OUT"
      - name: Commit report
        run: |
          git config user.name "kismat-bot"
          git config user.email "kismat-bot@users.noreply.github.com"
          git add research/backtests
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "research: backtest $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
