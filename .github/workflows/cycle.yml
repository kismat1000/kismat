name: trading-cycle

on:
  schedule:
    - cron: "7 */2 * * *"     # every two hours; adjust once you know your Actions budget
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kismat-cycle
  cancel-in-progress: false

jobs:
  cycle:
    # Whatever branch triggers this (cron fires on the default branch), the
    # cycle always reads and writes state on main. One journal, one history.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: data_cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-
      - name: Run one cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KISMAT_APPROVAL_MODE: ${{ vars.KISMAT_APPROVAL_MODE || '0' }}
          KISMAT_MODE: paper
        run: python -m kismat cycle
      - name: Commit state, packet, and dashboard
        run: |
          git config user.name "kismat-bot"
          git config user.email "kismat-bot@users.noreply.github.com"
          git add state research/packets research/news docs
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(cycle): $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
