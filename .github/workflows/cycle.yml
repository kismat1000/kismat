name: trading-cycle

on:
  schedule:
    # GitHub drops scheduled slots under load (on 2026-09-06 it honoured roughly one slot
    # in ten), so the schedule is dense: every 10 minutes, off the :00/:30 marks. The
    # concurrency group below stops runs overlapping; a run that lands while another is
    # active simply queues behind it.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kismat-cycle
  cancel-in-progress: false

jobs:
  cycle:
    # Whatever branch triggers this (cron fires on the default branch), the
    # cycle always reads and writes state on main. One journal, one history.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: data_cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-
      - name: Run one cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KISMAT_APPROVAL_MODE: ${{ vars.KISMAT_APPROVAL_MODE || '0' }}
          KISMAT_MODE: paper
          KISMAT_CACHE_TTL_HOURS: "0.15"  # refresh prices every run so stops see current levels
          KISMAT_VENUES: ${{ vars.KISMAT_VENUES || 'us_stocks=alpaca,us_etfs=alpaca,crypto=alpaca' }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          BINANCE_TESTNET_KEY: ${{ secrets.BINANCE_TESTNET_KEY }}
          BINANCE_TESTNET_SECRET: ${{ secrets.BINANCE_TESTNET_SECRET }}
        run: python -m kismat cycle
      - name: Commit state, packet, and dashboard
        run: |
          git config user.name "kismat-bot"
          git config user.email "kismat-bot@users.noreply.github.com"
          git add state research/packets research/news research/outcomes.json research/lessons.md docs
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(cycle): $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
