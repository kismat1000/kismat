name: admin

on:
  workflow_dispatch:
    inputs:
      deposit:
        description: "Paper cash to add (0 for none)"
        default: "0"
      reset_guards:
        description: "Clear once-per-bar entry guards"
        type: boolean
        default: false
      reset_halt:
        description: "Clear the kill switch"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kismat-cycle
  cancel-in-progress: false

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Deposit
        if: ${{ inputs.deposit != '0' && inputs.deposit != '' }}
        run: python -m kismat deposit "${{ inputs.deposit }}"
      - name: Reset entry guards
        if: ${{ inputs.reset_guards }}
        run: python -m kismat reset-guards
      - name: Reset halt
        if: ${{ inputs.reset_halt }}
        run: python -m kismat reset-halt
      - name: Commit state
        run: |
          git config user.name "kismat-bot"
          git config user.email "kismat-bot@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(admin): $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
