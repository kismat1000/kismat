name: weekly-review

on:
  schedule:
    - cron: "0 21 * * 0"      # Sunday 21:00 UTC = Monday morning in Australia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m kismat review
      - run: |
          git config user.name "kismat-bot"
          git config user.email "kismat-bot@users.noreply.github.com"
          git add research/reviews
          git diff --cached --quiet || (git commit -m "chore(review): weekly packet" && git push origin HEAD:main)
