name: weekly-review

on:
  schedule:
    - cron: "0 21 * * 0"      # Sunday 21:00 UTC = Monday morning in Australia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m kismat review
      - name: Per-rule attribution since the 2026-11-17 fixes
        # Scoped to the fix date on purpose: the 57 historical trend-break
        # losses are permanent, so an all-time report would be red forever and
        # stop being a signal. This asks whether a rule is losing money NOW,
        # and fails the job if one is -- a red weekly review is a notification,
        # which is what the original failure lacked. Every weekly backtest for
        # two months showed the bug and nobody read them.
        run: |
          mkdir -p research/reviews
          OUT="research/reviews/$(date -u +%Y-%m-%d)-attribution.md"
          { echo '# Per-rule attribution'; echo; echo '```'; } > "$OUT"
          python -m kismat attribution --since 2026-11-17 --fail-on-losing | tee -a "$OUT"
          STATUS=${PIPESTATUS[0]}
          echo '```' >> "$OUT"
          exit $STATUS
      # always(): the attribution step fails on purpose when a rule is losing
      # money, and the report is exactly what we want committed in that case.
      - if: always()
        run: |
          git config user.name "kismat-bot"
          git config user.email "kismat-bot@users.noreply.github.com"
          git add research/reviews
          git diff --cached --quiet || (git commit -m "chore(review): weekly packet" && git push origin HEAD:main)
