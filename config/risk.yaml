# Hard risk limits. Plain code enforces these. No agent, prompt, or memo can
# override them. Change them here, commit, and the next cycle picks them up.

starting_cash: 10000.0         # paper account size in base currency (USD); test book
base_currency: USD

max_position_pct: 0.10         # max 10% of equity in any single position
max_positions: 12              # max simultaneous open positions. 2026-09-07 walk-forward: 8 slots are more
                               # robust on average (0.62 vs 0.20) with a smaller drawdown (-19% vs -21%) but
                               # return less (+46% vs +51% on average; +66% vs +86% on the live set). Kept at 12.
max_asset_class_pct:           # max share of equity per asset class
  crypto: 0.60
  us_stocks: 0.60
  us_etfs: 0.60
  au_stocks: 0.60

per_trade_risk_pct: 0.01       # risk 1% of equity per trade (entry to stop distance)
stop_atr_multiple: 2.5         # initial and trailing stop distance in ATR units. 2026-09-07 walk-forward: 4.0 is
                               # more robust on average (0.58 vs 0.24, drawdown -18% vs -22%) but with 1% risk
                               # sizing it returns less (+42% vs +55% on average; +74% vs +86% on the live set).
trend_break_exit: true         # also exit when close < SMA50 while underwater
trend_break_days: 1            # consecutive closes below SMA50 (while underwater) before the trend-break exit fires
time_stop_days: 0              # exit a position still underwater after this many days (0 = off)
regime_breadth_min: 0.0        # new entries only when this share of the asset class is above its SMA200 (0 = off)
regime_index: {}               # asset class -> index symbol (from the universe) that must close above its SMA200
                               # before the class may open new positions, e.g. {us_stocks: SPY, crypto: BTCUSDT}.
                               # Tested every week by the walk-forward research ("mkt" variants); empty = off.
                               # 2026-09-07: on average it adds return (+53% vs +44%) and trims drawdown (-19% vs
                               # -21%), but on the live set it left return flat (+85.6% vs +86.0%), cut the second
                               # half (+15% vs +22%) and made quarters choppier (robustness 0.07 vs 0.63). Off.
earnings_blackout_days: 7      # no new US/ASX stock entries within this many days before an earnings date
                               # (0 = off). Dates come free from Yahoo; unknown dates never block.
                               # Evidence (research/backtests/study-2026-09-12.md, 5 years, live sizing):
                               # 7 days beat the live set on every measure: +91.2% vs +81.2% return, Sharpe
                               # 0.95 vs 0.88, out of sample +27.6% vs +19.1%, drawdown -22.8% vs -23.6%,
                               # worst quarter -8.5% vs -8.7%, same share of positive quarters. It did NOT
                               # clear the 0.25 robustness margin (0.76 vs 0.74), so this is adopted as a
                               # risk rule with an economic reason (earnings gaps are the one-day risk a
                               # trailing stop cannot cap), not as an optimisation. 3 days was worse than
                               # off on return, so the Saturday study keeps re-testing it; revert if it
                               # falls behind the live set.
min_trade_value: 10.0          # skip dust orders below this value

max_daily_loss_pct: 0.03       # lose 3% in a day: no new entries until next day
max_drawdown_pct: 0.25         # lose 25% from peak: kill switch, liquidate and halt everything.
                               # Paper-test setting: the 5-year walk-forward (2026-09-07, live sizing rules)
                               # shows the live parameters' worst drawdown at 23.6% (2022 bear market), so a
                               # halt here means something outside five years of history is happening. A 10%
                               # switch would have halted the test book several times. Tighten to 0.05-0.10
                               # before live, when the account is small enough that a halt costs nothing.

entry_score_threshold: 0.35    # combined score needed to open a position
exit_score_threshold: -0.10    # combined score below this closes a position

# Rotation: when the book is full, replace the weakest holding with a much
# stronger candidate. 0 disables it. Off since the 2026-09-06 backtest:
# whole universe, two years, rotation off +18.0% / Sharpe 0.79 / max DD -12.5%
# against +14.1% / 0.64 / -13.7% at margin 0.30. Re-checked by the weekly backtest.
rotation_margin: 0.0           # candidate score must beat the weakest holding by this much
min_hold_days: 1               # never rotate out a position younger than this

# Cost model for paper fills. Conservative on purpose.
fees_bps:
  crypto: 10                   # 0.10% per side (Binance spot without BNB discount)
  us_stocks: 5                 # commission-free brokers still pay spread
  us_etfs: 5
  au_stocks: 15                # ASX brokers: min commissions hurt small orders
slippage_bps: 5
