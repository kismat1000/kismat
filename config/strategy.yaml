# Signal windows and weights. The same values drive the live engine, the
# backtester, and the walk-forward research. Change them only with a
# research/backtests report that shows the new set survived out of sample.
#
# Evidence (research/backtests/wf-2026-09-07.md: 5 years, 50 symbols, 96
# variants, sized by the live 1% risk rule): sma50/200 with 63-day momentum
# ranks 31 of 96 on robustness but has the highest total return of any set
# (+86%, 15.5% a year, Sharpe 0.91, max drawdown -23.6%) and the best second
# half (+21.5%). Every set that scored more robust gave up return for it.
# Holding this set beat re-picking the best set every quarter (+102% vs +58%
# over the same 21 quarters). On average across the grid sma50/200 beat
# sma20/100 (robustness 0.50 vs 0.32) and 63-day momentum beat 126 and 252
# (0.49 vs 0.34 and 0.41; return +58% vs +51% and +37%). Kept. The weekly
# research workflow re-tests this and prints a verdict at the top of its report.
#
# Pattern features (research/backtests/study-2026-09-12.md, 5 years, live
# sizing): relative strength against the class benchmark, distance from the
# 52-week high, and a volatility squeeze were each tried alone and together.
# None beat the live set: rs 0.15 same robustness with less return (+62% vs
# +81%), 52-week high 0.15 worse (robustness 0.37 vs 0.74), squeeze 0.10
# neutral (0.46). They stay at weight 0 and remain in the packet for the
# desk's pattern analyst to read; the Saturday study keeps re-testing them.

sma_fast: 50
sma_slow: 200
mom_days: 63           # momentum lookback in trading days
mom_scale: 0.30        # this much momentum earns the full momentum weight
breakout_days: 55
atr_days: 14
rsi_days: 14
rsi_hot: 80
rsi_cold: 30
chaos_atr_pct: 0.08    # above this ATR/price the score is halved
w_trend: 0.35
w_misaligned: 0.10
w_mom: 0.30
w_breakout: 0.20
w_hot: 0.20
w_pullback: 0.10

# Pattern features, off until the feature study says otherwise (see above).
w_rs: 0.0              # relative strength: momentum minus the class benchmark's
w_high: 0.0            # nearness to the 252-day high
w_squeeze: 0.0         # volatility squeeze inside an uptrend
benchmarks:            # asset class -> benchmark symbol for relative strength (must be in the universe)
  us_stocks: SPY
  us_etfs: SPY
  crypto: BTCUSDT
