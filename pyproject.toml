[project]
name = "kismat"
version = "0.1.0"
description = "Research-first, risk-first AI trading lab. Paper trading by default."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "yfinance>=0.2.40",
  "feedparser>=6.0",
  "requests>=2.31",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["kismat*"]
